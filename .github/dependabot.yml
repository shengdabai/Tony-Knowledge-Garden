version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # Version update PRs are off, so only security alerts send mail. Raise this limit to turn them on again.
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
    groups:
      production-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    # Version update PRs are off, so only security alerts send mail. Raise this limit to turn them on again.
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
    groups:
      ci-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
